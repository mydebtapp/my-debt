  dia_mes: currentLang === 'es' ? "Día específico del mes" : "Specific day of month"
});

const PD = { diario: 1, semanal: 7, quincenal: 15, mensual: 30, dia_mes: 30 };
const PM = { diario: 30, semanal: 52/12, quincenal: 2, mensual: 1, dia_mes: 1 };

/* ---------- Métricas Financieras ---------- */
function nextPay(d) {
  const t = new Date(today() + "T00:00"), s = new Date(d.fecha_inicio + "T00:00");
  if (d.frecuencia === "mensual" || d.frecuencia === "dia_mes") {
    const day = d.frecuencia === "dia_mes" && d.dia_mes ? d.dia_mes : s.getDate();
    for (let i = 0; i < 14; i++) {
      const last = new Date(t.getFullYear(), t.getMonth() + i + 1, 0).getDate();
      const c = new Date(t.getFullYear(), t.getMonth() + i, Math.min(day, last));
      if (c >= t) return c;
    }
  }
  const st = PD[d.frecuencia], k = Math.max(0, Math.ceil((t - s) / 864e5 / st));
  return addDays(s, k * st);
}

function met(d, ab) {
  const paid = ab.reduce((s, a) => s + +a.monto, 0);
  const days = Math.max(0, (Date.now() - new Date(d.fecha_inicio)) / 864e5);
  const total = +d.monto + d.monto * (d.tasa / 100) * days / 365;
  const saldo = Math.max(0, total - paid);
  const cuota = d.ingreso_mensual * d.pct_ingreso / 100 / PM[d.frecuencia];
  const n = cuota > 0 && saldo > 0 ? Math.ceil(saldo / cuota) : null;
  const esp = Math.floor(days / PD[d.frecuencia]);
  return {
    paid, total, saldo, cuota,
    avance: total ? Math.min(1, paid / total) : 0,
    fin: saldo <= 0 ? (currentLang === 'es' ? "Liquidada" : "Paid off") : n ? fd(addDays(new Date(), n * PD[d.frecuencia])) : "—",
    punt: esp <= 0 ? 100 : Math.min(100, Math.round(ab.length / esp * 100)),
    next: nextPay(d)
  };
}

let passRevealed = false;
function toggleShowPass() {
  passRevealed = !passRevealed;
  const input = $("#maskPw");
  const btn = $("#pwToggleBtn");
  if (passRevealed) {
    input.value = localStorage.getItem("my_debt_last_pw") || "(Contraseña activa)";
    btn.textContent = t('hidePass');
  } else {
    input.value = "••••••••••••";
    btn.textContent = t('showPass');
  }
}

async function updatePassword() {
  if (!U) return go('auth');
  const np = $("#newPw").value;
  if (!np || np.length < 6) return toast(currentLang==='es'?"La contraseña debe tener al menos 6 caracteres":"Password must be at least 6 chars");
  const { error } = await sb.auth.updateUser({ password: np });
  if (error) return toast(error.message);
  localStorage.setItem("my_debt_last_pw", np);
  toast(t('passUpdated'));
  $("#newPw").value = "";
}

/* ---------- Exportar a CSV ---------- */
function exportCSV() {
  if (!DEB.length) return toast(currentLang==='es'?"No hay deudas para exportar":"No debts to export");
  let csv = "Deuda,MontoOriginal,Moneda,TasaAnual,Frecuencia,FechaInicio\n";
  DEB.forEach(d => {
    csv += `"${d.nombre}",${d.monto},${d.moneda},${d.tasa},${d.frecuencia},${d.fecha_inicio}\n`;
  });
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `my_debt_backup_${iso(new Date())}.csv`;
  a.click();
  toast(currentLang==='es'?"CSV exportado con éxito":"CSV exported successfully");
}

async function addAb(id) {
  if (!U) return go('auth');
  const monto = +$("#am").value, fecha = $("#af").value, f = $("#ai").files[0];
  if (!(monto > 0) || !fecha) return toast(currentLang==='es'?"Indica fecha y monto válido":"Provide valid date and amount");
  const btn = $("#abBtn");
  btn.disabled = true;
  btn.textContent = currentLang==='es'?"Subiendo y guardando…":"Uploading and saving...";
  try {
    const url = f ? await upload(f) : null;
    const r = await sb.from("abonos").insert({ deuda_id: id, fecha, monto, nota: $("#an").value.trim() || null, comprobante_url: url });
    if (r.error) throw r.error;
    await load();
    go("det", id);
    toast(currentLang==='es'?"Abono registrado con éxito":"Payment registered successfully");
  } catch (x) {
    toast(x.message);
    btn.disabled = false;
    btn.textContent = t('savePayment');
  }
}

async function delAb(id) {
  if (!U) return go('auth');
  if (!confirm(currentLang==='es'?"¿Quitar este abono?":"Remove this payment?")) return;
  const r = await sb.from("abonos").delete().eq("id", id);
  if (r.error) return toast(r.error.message);
  await load();
  render();
}

async function delDeb(id) {

/* ---------- Arranque Blindado y Manejo de Auth Tokens ---------- */
(async () => {
  const hideSplash = () => { const s = $("#splash"); if(s) s.remove(); };
  
  // 1. Detectar si viene un enlace compartido público
  const urlParams = new URLSearchParams(location.hash.includes('?') ? location.hash.split('?')[1] : '');
  const langParam = urlParams.get('lang');
  if (langParam && (langParam === 'es' || langParam === 'en')) {
    currentLang = langParam;
    localStorage.setItem("my_debt_lang", currentLang);
  }

  const sh = location.hash.match(/^#\/v\/([0-9a-f-]{36})/i);
  if (sh && OK) {
    await vShared(sh[1]);
    hideSplash();
    return;
  }
  
  if (!OK) {
    vAuth();
    hideSplash();
    return;
  }

  try {
    // Supabase procesa automáticamente el token de confirmación del correo si viene en el hash
    const { data: { session }, error } = await sb.auth.getSession();
    U = session ? session.user : null;

    if (U) {
      // Limpiar el hash de la URL si venía un token de confirmación para dejar la URL limpia
      if (window.location.hash.includes('access_token')) {
        history.replaceState(null, '', window.location.pathname);
      }

      await load();
      if (!PRO.username) {
        vOnboarding();
      } else {
        vList();
      }
    } else {
      vAuth();
    }
  } catch (err) {
    console.error("Error al arrancar:", err);
    vAuth();
  } finally {
    hideSplash();
  }

  sb.auth.onAuthStateChange(async (_, s) => {
    const newUser = s ? s.user : null;
    if (newUser?.id !== U?.id) {
      U = newUser;
      if (U) {
        await load();
        if (!PRO.username) go("onboarding"); else go("list");
      } else {
        go("auth");
      }
    }
  });
})();
